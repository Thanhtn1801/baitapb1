<!doctype html><html lang="vi"><meta charset="utf-8"><title>Excel → Flow → Drive</title><link rel="stylesheet" href="style.css"><body><main><h1>Excel → Flow → Drive</h1><p>Mỗi dòng một video. Caption, link blog và các cột khác được giữ nguyên.</p><label>1. Chọn file Excel (.xlsx) <input id="excel" type="file" accept=".xlsx"></label><section id="mapping" hidden><label>Trang tính <select id="sheet"></select></label><label>Cột chứa link ảnh <select id="column"></select></label><button id="load">2. Đọc ảnh</button></section><p id="status" role="status"></p><p>Phiên bản thử nghiệm hỗ trợ chuyển ảnh và prompt sang tab Flow. Bạn kiểm tra ảnh, bấm tạo video và tải lên Drive, sau đó nhập link bên dưới.</p><a href="https://flow.google.com/" target="_blank" rel="noreferrer">Mở Flow</a> · <a href="https://drive.google.com/" target="_blank" rel="noreferrer">Mở Google Drive</a><label>Prompt video dùng cho mỗi dòng <textarea id="prompt" rows="3">Tạo video từ ảnh tham chiếu, chuyển động máy quay nhẹ nhàng. Giữ nguyên chủ thể và nội dung chữ trong ảnh.</textarea></label><section id="rows"></section><button id="export" disabled>3. Xuất Excel mới</button></main><script src="app.js"></script></body></html>
